name = "sitefetch"
description = "Command-line website mirroring tool built on sitefetchlib"
version = "0.1.0"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
long-description = "sitefetch is the CLI crate for mirroring a website to a local directory. It handles command-line parsing, localized terminal output, summaries, and delegates crawling to the reusable sitefetchlib library crate."

# Fill this with the canonical project URL when one exists.
website = "https://github.com/bracke/sitefetch"
tags = ["website", "mirror", "crawler", "http", "cli"]

executables = ["sitefetch", "check_sitefetch"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
sitefetchlib = "*"

[[depends-on]]
i18n = "*"

[[depends-on]]
messages = "*"

[[depends-on]]
terminal_styles = "*"

[[depends-on]]
project_tools = "*"

[[pins]]
sitefetchlib = { path = "../sitefetchlib" }

[[pins]]
i18n = { path = "../i18n" }

[[pins]]
messages = { path = "../messages" }

[[pins]]
terminal_styles = { path = "../terminal_styles" }

[[pins]]
project_tools = { path = "../project_tools" }

# Pins are root-only in Alire: this root transitively builds zlib (via
# sitefetchlib -> httpclient), so it must pin zlib's dependency cryptolib.
[[pins]]
cryptolib = { path = "../cryptolib" }

# Bundle i18n's generated locale data into share/i18n after every build. The
# load-only i18n serves formatting from those files at runtime, so a deployed
# bin/sitefetch must ship them (found at Exe/../share/i18n). bundle_i18n_data is
# a standalone Ada tool (tools/i18n_bundle) kept out of the app's own bin so it
# is never installed; build it, then run it. Both steps are plain executables --
# no shell. gprbuild is incremental, so the build step is a no-op once current.
[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "tools/i18n_bundle/bundle_i18n_data.gpr", "-p", "-q"]

[[actions]]
type = "post-build"
command = ["tools/i18n_bundle/bin/bundle_i18n_data"]

[build-profiles]
"*" = "development"
